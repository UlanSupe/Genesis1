[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "1.0.0"
description = "TraceForge: Evidence-First Financial Audit Gym (autonomous RL environment)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []          # runtime: standard library only

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
traceforge = "traceforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
